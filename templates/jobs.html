<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipAI — My Jobs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--card:#14141c;--border:#262633;--acc:#7c3aed;--acc2:#a855f7;--green:#22c55e;--red:#ef4444;--yel:#eab308;--txt:#f1f1f4;--mut:#9a9ab0}
body{background:radial-gradient(1000px 500px at 50% -100px,#1e1b3a 0%,var(--bg) 60%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:32px 16px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.top a{color:var(--acc2);text-decoration:none;font-size:15px;font-weight:600}
h1{font-size:26px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;display:flex;gap:16px;align-items:center}
.card:hover{border-color:var(--acc)}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.info .meta{color:var(--mut);font-size:12px;margin-bottom:8px}
.bar{background:#0d0d14;border-radius:8px;height:10px;overflow:hidden;border:1px solid var(--border)}
.bar>div{height:100%;background:linear-gradient(90deg,#7c3aed,#a855f7);border-radius:8px;transition:width .5s}
.step{font-size:12px;color:var(--mut);margin-top:6px}
.badge{font-size:12px;font-weight:700;border-radius:20px;padding:6px 14px;white-space:nowrap}
.badge.queued{background:#3b2f1a;color:var(--yel)}
.badge.running{background:#1c1530;color:var(--acc2)}
.badge.done{background:#14532d;color:#86efac}
.badge.error{background:#3b1a1a;color:#fca5a5}
.open{background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:60px 20px}
</style></head>
<body><div class="wrap">
<div class="top"><a href="/">← New clips</a><h1>📋 My Jobs</h1><span></span></div>
<div id="list"></div>
</div>
<script>
async function load(){
  const r = await fetch("/api/jobs"); const j = await r.json();
  const box = document.getElementById("list");
  if(!j.jobs.length){ box.innerHTML = '<div class="empty">No jobs yet.<br><br><a href="/" style="color:var(--acc2)">Create your first clips →</a></div>'; return; }
  box.innerHTML = j.jobs.map(x=>{
    const bc = x.status;
    const badge = bc==="done"?"done":bc==="error"?"error":bc==="running"?"running":"queued";
    const pct = x.progress||0;
    const bar = (bc==="running"||bc==="queued") ? `<div class="bar"><div style="width:${pct}%"></div></div><div class="step">${esc(x.step||"")} ${pct}%</div>` : "";
    const open = bc==="done" ? `<a class="open" href="/job/${x.jid}">Open →</a>` : bc==="running"||bc==="queued" ? `<a class="open" href="/job/${x.jid}">Watch →</a>` : "";
    const sub = bc==="done" ? `${x.nclips} clips ready` : bc==="error" ? "❌ "+esc((x.error||"failed").slice(0,80)) : (x.source==="youtube"?"🔗 YouTube":"📤 Upload");
    return `<div class="card"><span class="badge ${badge}">${badge}</span><div class="info"><b>${esc(x.name)}</b><div class="meta">${sub}</div>${bar}</div>${open}</div>`;
  }).join("");
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
load(); setInterval(load, 4000);
</script></body></html>
