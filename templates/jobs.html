<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JpClips — My Projects</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--card:#14141c;--card2:#1c1c26;--border:#262633;--txt:#f1f1f4;--mut:#9a9ab0;
--acc:#7c3aed;--acc-d:#a78bfa;--green:#22c55e;--red:#ef4444;--yel:#b45309}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;min-height:100vh}
.layout{display:flex;min-height:100vh}
.side{width:64px;background:var(--bg);border-right:1px solid var(--border);padding:14px 0;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.side .logo{display:none}
.nav{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.nav a{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--mut);text-decoration:none;font-size:19px}
.nav a:hover{background:var(--card2);color:var(--txt)}
.nav a.on{background:var(--card2);color:var(--txt)}
.nav .sec{display:none}
.nav a .nl{display:none}
.main{flex:1;padding:28px;max-width:1000px}
.greet{font-size:26px;font-weight:700;margin-bottom:4px}
.gsub{color:var(--mut);font-size:14px;margin-bottom:22px}
.newbtn{display:inline-block;background:#fff;color:#111;font-weight:700;font-size:15px;border-radius:12px;padding:13px 28px;text-decoration:none;margin-bottom:24px}
.newbtn:hover{transform:translateY(-1px)}
h2.sec{font-size:16px;margin:6px 0 14px;color:var(--txt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:.15s}
.card:hover{box-shadow:0 6px 16px rgba(0,0,0,.09);border-color:var(--acc)}
.card .thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#23232f,#121218);position:relative;overflow:hidden}
.card .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--mut)}
.card .thumb .score{position:absolute;top:8px;right:8px;background:#fff;color:#111;font-size:11px;font-weight:800;border-radius:8px;padding:3px 9px}
.card .cbd{padding:14px 16px 16px}
.card b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:8px 0 4px}
.card .meta{color:var(--mut);font-size:12px;margin-bottom:10px}
.badge{font-size:11px;font-weight:700;border-radius:20px;padding:4px 12px;display:inline-block;margin-bottom:4px}
.badge.queued{background:#fef3c7;color:var(--yel)}
.badge.running{background:#2e1065;color:var(--acc-d)}
.badge.done{background:#dcfce7;color:#15803d}
.badge.error{background:#fee2e2;color:var(--red)}
.bar{background:#eef0f2;border-radius:8px;height:10px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:linear-gradient(90deg,#ff6b00,#ff9a3c);border-radius:8px;transition:width .5s}
.step{font-size:12px;color:var(--mut);margin-top:6px}
.time{font-size:11px;color:var(--mut);margin-left:8px}
.open{display:inline-block;margin-top:12px;background:linear-gradient(180deg,#ff7d1a,#f25c00);color:#fff;border-radius:10px;padding:9px 20px;font-size:13px;font-weight:700;text-decoration:none}
.empty{text-align:center;color:var(--mut);padding:50px 20px;background:var(--card);border:1px dashed var(--border);border-radius:16px}
@media(max-width:760px){.side{display:none}.main{padding:18px}}
</style></head>
<body><div class="layout">
<div class="side">
<div class="logo">✂️ Clip<span style="color:var(--acc)">AI</span></div>
<div class="nav">
<a href="/jobs" class="on">🏠 Home</a>
<a href="/jobs">📅 Calendar</a>
<a href="/jobs">📊 Analytics</a>
<a href="/dashboard">✨ API &amp; Integrations</a>
<div class="sec">Folders</div>
<a href="/jobs">📁 All projects</a>
<a href="/dashboard">➕ New project</a>
</div>
</div>
<div class="main">
<div class="greet" id="greet">Good Morning</div>
<div class="gsub">Create viral shorts from your long videos.</div>
<a class="newbtn" href="/dashboard">＋ New Project</a>
<h2 class="sec">Projects</h2>
<div class="grid" id="list"></div>
</div>
</div>
<script>
(function(){const h=new Date().getHours();
document.getElementById('greet').textContent = h<12?"Good Morning":h<17?"Good Afternoon":"Good Evening";})();
async function load(){
  const r = await fetch("/api/jobs"); const j = await r.json();
  const box = document.getElementById("list");
  if(!j.jobs.length){ box.innerHTML = '<div class="empty" style="grid-column:1/-1">No projects yet.<br><br><a href="/dashboard" style="color:var(--acc);font-weight:700">Create your first clips →</a></div>'; return; }
  box.innerHTML = j.jobs.map(x=>{
    const bc = x.status;
    const badge = bc==="done"?"done":bc==="error"?"error":bc==="running"?"running":"queued";
    const pct = x.progress||0;
    const bar = (bc==="running"||bc==="queued") ? `<div class="bar"><div style="width:${pct}%"></div></div><div class="step">${esc(x.step||"")} · ${pct}%</div>` : "";
    const open = bc==="done" ? `<a class="open" href="/job/${x.jid}">Open →</a>` : bc==="running"||bc==="queued" ? `<a class="open" href="/job/${x.jid}">Watch →</a>` : "";
    const sub = bc==="done" ? `${x.nclips} clip${x.nclips===1?"":"s"} ready 🎉` : bc==="error" ? "❌ "+esc((x.error||"failed").slice(0,80)) : (x.source==="youtube"?"🔗 YouTube":"📤 Upload");
    const thumb = (bc==="done"&&x.thumb)
      ? `<video src="/preview/${x.jid}/${x.thumb}" preload="metadata" muted playsinline></video>${x.top_score?`<span class="score">⚡ ${x.top_score}</span>`:""}`
      : `<div class="ph">${bc==="error"?"⚠️":bc==="running"?"⏳":"🎬"}</div>`;
    return `<div class="card"><div class="thumb">${thumb}</div><div class="cbd"><span class="badge ${badge}">${badge}</span><span class="time">${ago(x.created)}</span><b>${esc(x.name)}</b><div class="meta">${sub}</div>${bar}${open}</div></div>`;
  }).join("");
}
function ago(ts){ if(!ts) return ""; const s=Math.floor(Date.now()/1000-ts);
  if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; }
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
load(); setInterval(load, 4000);
</script></body></html>
