<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JpClips — AI Video Clipper{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            os: {
              bg: '#0a0a0e',
              sidebar: '#0d0d13',
              card: '#121218',
              card2: '#16161e',
              border: '#1e1e28',
              border2: '#2a2a38',
              orange: '#ff8c42',
              orangeDark: '#e06f28',
              muted: '#8a8a98',
              faint: '#55555f'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Instrument Serif', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    html, body { background: #0a0a0e; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0e; }
    ::-webkit-scrollbar-thumb { background: #2a2a38; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a48; }
    .nav-item { transition: all .15s ease; }
    .nav-item:hover { background: rgba(255,255,255,.04); }
    .nav-item.active { background: rgba(255,140,66,.08); border-left: 2px solid #ff8c42; }
    .nav-item.active .nav-label { color: #fff; }
    .serif-heading { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.01em; }
    .eyebrow { font-size: 11px; letter-spacing: .22em; color: #8a8a98; text-transform: uppercase; font-weight: 500; }
    .btn-orange { background: linear-gradient(180deg, #ff9a5c, #f07f36); color: #1a0e05; font-weight: 700; transition: all .15s ease; }
    .btn-orange:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-orange:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .fmt-card { transition: all .15s ease; cursor: pointer; }
    .fmt-card:hover { border-color: #3a3a48; }
    .fmt-card.selected { border-color: #ff8c42 !important; background: rgba(255,140,66,.06) !important; }
    .spinner { width: 28px; height: 28px; border: 3px solid #2a2a38; border-top-color: #ff8c42; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .scanline { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #ff8c42, transparent); animation: scan 3s ease-in-out infinite; }
    @keyframes scan { 0% { top: 4%; } 50% { top: 94%; } 100% { top: 4%; } }
    input[type="checkbox"].os-check { appearance: none; width: 18px; height: 18px; border: 1.5px solid #3a3a48; border-radius: 5px; background: #16161e; cursor: pointer; position: relative; flex-shrink: 0; }
    input[type="checkbox"].os-check:checked { background: #ff8c42; border-color: #ff8c42; }
    input[type="checkbox"].os-check:checked::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #1a0e05; font-size: 12px; font-weight: 800; }
    select.os-select, input.os-input { background: #16161e; border: 1px solid #2a2a38; border-radius: 10px; color: #f3f4f6; }
    select.os-select:focus, input.os-input:focus { outline: none; border-color: #ff8c42; }
    .log-line { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; line-height: 1.7; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
<div class="flex min-h-screen">

  <!-- ============ SIDEBAR ============ -->
  <aside class="w-[228px] shrink-0 bg-os-sidebar border-r border-os-border flex flex-col fixed inset-y-0 left-0 z-40">
    <a href="/dashboard" class="flex items-center gap-2.5 px-5 pt-5 pb-6">
      <span class="w-8 h-8 rounded-xl bg-gradient-to-br from-os-orange to-os-orangeDark flex items-center justify-center">
        <i class="fa-solid fa-bolt text-[#1a0e05] text-sm"></i>
      </span>
      <span class="font-serif text-[22px] text-white">JpClips</span>
    </a>

    <nav class="flex-1 px-2.5 space-y-0.5 overflow-y-auto">
      <a href="/dashboard" class="nav-item {% if active=='generator' %}active{% endif %} flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-2 border-transparent">
        <i class="fa-solid fa-table-cells-large text-[15px] text-os-orange w-5 text-center"></i>
        <span class="nav-label text-[13.5px] text-gray-300 font-medium">clip generator</span>
        <span class="ml-auto text-[10px] text-os-faint font-medium">01</span>
      </a>
      <div class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-2 border-transparent opacity-45 cursor-not-allowed" title="Coming soon">
        <i class="fa-solid fa-rocket text-[15px] text-os-muted w-5 text-center"></i>
        <span class="nav-label text-[13.5px] text-gray-400 font-medium">autopilot</span>
        <span class="ml-auto text-[9px] font-bold text-os-orange bg-os-orange/10 border border-os-orange/30 rounded px-1.5 py-0.5">NEW</span>
        <span class="text-[10px] text-os-faint font-medium">02</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-2 border-transparent opacity-45 cursor-not-allowed" title="Coming soon">
        <i class="fa-solid fa-wand-magic-sparkles text-[15px] text-os-muted w-5 text-center"></i>
        <span class="nav-label text-[13.5px] text-gray-400 font-medium">ai shorts</span>
        <span class="ml-auto text-[10px] text-os-faint font-medium">03</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-2 border-transparent opacity-45 cursor-not-allowed" title="Coming soon">
        <i class="fa-solid fa-robot text-[15px] text-os-muted w-5 text-center"></i>
        <span class="nav-label text-[13.5px] text-gray-400 font-medium">ai agent</span>
        <span class="ml-auto text-[10px] text-os-faint font-medium">04</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-2 border-transparent opacity-45 cursor-not-allowed" title="Coming soon">
        <i class="fa-solid fa-grid-2 text-[15px] text-os-muted w-5 text-center"></i>
        <span class="nav-label text-[13.5px] text-gray-400 font-medium">ugc gallery</span>
        <span class="ml-auto text-[10px] text-os-faint font-medium">05</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-2 border-transparent opacity-45 cursor-not-allowed" title="Coming soon">
        <i class="fa-brands fa-youtube text-[15px] text-os-muted w-5 text-center"></i>
        <span class="nav-label text-[13.5px] text-gray-400 font-medium">youtube studio</span>
        <span class="ml-auto text-[10px] text-os-faint font-medium">06</span>
      </div>
      <a href="/jobs" class="nav-item {% if active=='history' %}active{% endif %} flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-2 border-transparent">
        <i class="fa-solid fa-clock-rotate-left text-[15px] {% if active=='history' %}text-os-orange{% else %}text-os-muted{% endif %} w-5 text-center"></i>
        <span class="nav-label text-[13.5px] text-gray-300 font-medium">history</span>
        <span class="ml-auto text-[10px] text-os-faint font-medium">07</span>
      </a>
      <div class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg border-l-2 border-transparent opacity-45 cursor-not-allowed" title="Coming soon">
        <i class="fa-solid fa-gear text-[15px] text-os-muted w-5 text-center"></i>
        <span class="nav-label text-[13.5px] text-gray-400 font-medium">settings</span>
        <span class="ml-auto text-[10px] text-os-faint font-medium">08</span>
      </div>
    </nav>

    <div class="px-5 py-4 border-t border-os-border space-y-2.5">
      <a href="/" class="flex items-center gap-2.5 text-[12.5px] text-os-muted hover:text-white transition-colors">
        <i class="fa-solid fa-globe w-4 text-center"></i> landing page
      </a>
      <a href="https://github.com/tanvirvaioff/clipai" target="_blank" class="flex items-center gap-2.5 text-[12.5px] text-os-muted hover:text-white transition-colors">
        <i class="fa-brands fa-github w-4 text-center"></i> open source
      </a>
      <div class="flex items-center gap-2.5 text-[12.5px] text-os-muted">
        <i class="fa-solid fa-tag w-4 text-center"></i> plans &amp; pricing
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="flex-1 ml-[228px] flex flex-col min-h-screen">

    <!-- Top bar -->
    <header class="sticky top-0 z-30 bg-os-bg/85 backdrop-blur-md border-b border-os-border">
      <div class="flex items-center gap-3 px-6 py-3">
        <a href="/dashboard" class="btn-orange rounded-full px-4 py-1.5 text-[13px] flex items-center gap-1.5">
          <i class="fa-solid fa-plus text-[11px]"></i> new project
        </a>
        <div class="flex-1"></div>
        <div class="hidden md:flex items-center gap-1.5 text-[12px] text-os-muted">
          <a href="#" class="w-7 h-7 rounded-lg flex items-center justify-center hover:bg-white/5 text-os-orange" title="Shorts"><i class="fa-solid fa-bolt"></i></a>
          <a href="#" class="w-7 h-7 rounded-lg flex items-center justify-center hover:bg-white/5" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
          <a href="#" class="w-7 h-7 rounded-lg flex items-center justify-center hover:bg-white/5" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" class="w-7 h-7 rounded-lg flex items-center justify-center hover:bg-white/5" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
        </div>
        <button onclick="alert('Unlimited on your own server 🎉')" class="flex items-center gap-2 bg-os-card border border-os-border rounded-full px-3.5 py-1.5 text-[12.5px] text-gray-300 hover:border-os-border2 transition-colors">
          <i class="fa-solid fa-bolt text-os-orange text-[11px]"></i>
          <span class="font-semibold">self-hosted</span>
          <span class="text-os-orange font-bold">upgrade</span>
        </button>
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-os-orange to-purple-600 flex items-center justify-center text-[13px] font-bold text-white">J</div>
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
