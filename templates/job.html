<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipAI — Processing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f7f9;--card:#fff;--border:#e5e7eb;--txt:#111827;--mut:#6b7280;
--acc:#ff6b00;--acc-d:#e55e00;--green:#16a34a;--red:#dc2626}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;min-height:100vh}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.topbar .logo{font-size:20px;font-weight:800}.topbar .logo span{color:var(--acc)}
.topbar a{color:var(--acc);font-weight:600;font-size:14px;text-decoration:none}
.wrap{max-width:900px;margin:28px auto;padding:0 16px 60px}
h1{font-size:22px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.badge{font-size:12px;font-weight:700;border-radius:20px;padding:5px 14px;background:var(--acc);color:#fff}
.badge.done{background:var(--green)}.badge.err{background:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
#log{background:#f8f9fb;border:1px solid var(--border);border-radius:12px;padding:12px;font-family:ui-monospace,monospace;font-size:12px;max-height:120px;overflow-y:auto;white-space:pre-wrap;color:var(--mut);line-height:1.5}
.step-chip{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;background:#f1f2f4;border:1px solid var(--border);color:var(--mut)}
.step-chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.step-chip.ok{background:#dcfce7;color:#15803d;border-color:#bbf7d0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.clip{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.clip:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.clip .th{position:relative;background:#000;aspect-ratio:9/14;overflow:hidden}
.clip video{width:100%;height:100%;object-fit:cover}
.score{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#ff6b00,#ef4444);color:#fff;font-weight:800;font-size:14px;border-radius:12px;padding:5px 12px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.score small{font-weight:600;opacity:.85;font-size:10px}
.clip .bd{padding:14px}
.clip .bd b{font-size:15px;display:block;margin-bottom:4px;line-height:1.3}
.clip .bd .tm{color:var(--mut);font-size:12px;margin-bottom:10px}
.btns{display:flex;gap:8px}
.btns a{flex:1;text-align:center;border-radius:10px;padding:10px;font-size:14px;font-weight:700;text-decoration:none}
.btns .mp4{background:linear-gradient(180deg,#ff7d1a,#f25c00);color:#fff;box-shadow:0 2px 8px rgba(255,107,0,.3)}
.btns .srt{background:#f1f2f4;border:1px solid var(--border);color:var(--txt)}
#empty{text-align:center;color:var(--mut);padding:30px;display:none}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pbar{margin-bottom:14px}
.pbar .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#step{font-weight:700;font-size:15px}
#pct{font-weight:800;font-size:18px;color:var(--acc)}
.ptrack{background:#eef0f2;border-radius:10px;height:14px;overflow:hidden}
#bar{height:100%;width:0%;background:linear-gradient(90deg,#ff6b00,#ff9a3c);border-radius:10px;transition:width .5s}
#detail{color:var(--mut);font-size:13px;margin-top:8px}
#steps{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.subbar{flex:1}.subbar .sl{font-size:10px;color:var(--mut);text-transform:uppercase;margin-bottom:2px}
.subbar .st{background:#eef0f2;border-radius:4px;height:6px}.subbar .sf{height:100%;border-radius:4px;background:linear-gradient(90deg,#ff6b00,#ff9a3c)}
</style></head>
<body>
<div class="topbar"><div class="logo">✂️ Clip<span style="color:var(--acc)">AI</span></div><a href="/jobs">📁 My Projects</a></div>
<div class="wrap">
<h1><span class="spin">⏳</span> <span id="ttl">Processing your video…</span> <span id="st" class="badge">running</span></h1>
<div class="card pbar">
<div class="row1"><span id="step">Starting…</span><span id="pct">0%</span></div>
<div class="ptrack"><div id="bar"></div></div>
<div id="detail"></div>
<div id="steps"></div>
</div>
<div class="card"><div id="log">starting…</div></div>
<div id="empty">No clips yet — still working…</div>
<div class="grid" id="clips"></div>
</div>
<script>
const jid = "{{ jid }}";
let done = false;
const STEPS = ["Analyzing content", "Finding moments", "Adding captions", "Reframing video", "Finalizing"];
function col(s){return s>=90?'🔥':s>=80?'⚡':'✨'}
function renderSteps(pct){
  const box = document.getElementById("steps");
  const idx = pct < 40 ? 0 : pct < 55 ? 1 : pct < 58 ? 2 : pct < 98 ? 3 : 4;
  box.innerHTML = STEPS.map((s,i)=>`<span class="step-chip ${i<idx?'ok':i===idx?'on':''}">${i<idx?'✓ ':''}${s}</span>`).join("");
}
async function poll(){
  const r = await fetch("/api/job/"+jid); const j = await r.json();
  const lg = document.getElementById("log");
  lg.textContent = j.log || "starting…"; lg.scrollTop = 1e9;
  const pct = j.progress || 0;
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("step").textContent = j.step || "Working…";
  document.getElementById("detail").textContent = j.detail || "";
  renderSteps(pct);
  const st = document.getElementById("st");
  if(j.status === "done" && !done){
    done = true; st.textContent = "done"; st.className = "badge done";
    document.getElementById("ttl").textContent = "Your clips are ready 🎉";
    document.querySelector(".spin").style.display = "none";
    const box = document.getElementById("clips"); box.innerHTML = "";
    const res = j.result || [];
    document.getElementById("empty").style.display = res.length ? "none" : "block";
    res.forEach(c=>{
      const subs = c.subs || {};
      const subbar = ["hook","flow","value","trend"].map(k=>{
        const v = subs[k] || 0;
        return `<div class="subbar"><div class="sl">${k} ${v}</div><div class="st"><div class="sf" style="width:${v*4}%"></div></div></div>`;
      }).join("");
      box.innerHTML += `<div class="clip"><div class="th"><video src="/preview/${jid}/${c.file}" controls preload="metadata" playsinline></video><div class="score">${col(c.score)} ${c.score}<br><small>VIRAL</small></div></div><div class="bd"><b>${esc(c.title)}</b><div class="tm">${c.start.toFixed(0)}s – ${c.end.toFixed(0)}s • 9:16 • captions</div><div style="display:flex;gap:8px;margin-bottom:12px">${subbar}</div><div class="btns"><a class="mp4" href="/dl/${jid}/${c.file}">⬇ MP4</a><a class="srt" href="/dl/${jid}/${c.srt}">📝 SRT</a></div></div></div>`;
    });
    return;
  }
  if(j.status === "error"){
    st.textContent = "error"; st.className = "badge err";
    document.getElementById("ttl").textContent = "Something went wrong";
    document.querySelector(".spin").style.display = "none";
    lg.textContent += "\n\n❌ ERROR: " + (j.error || "unknown");
    return;
  }
  setTimeout(poll, 3000);
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
poll();
</script></body></html>
